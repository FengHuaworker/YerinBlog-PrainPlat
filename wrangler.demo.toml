# 演示站配置：多租户平台（含 /ops 管理面板）部署到 prain.yerinblog.cc.cd
# 与 wrangler.toml / wrangler.prod.toml 分离，这个文件不提交

name = "prain-demo"
main = "src/index.ts"
compatibility_date = "2025-05-01"
workers_dev = true

routes = [
  { pattern = "prain.yerinblog.cc.cd/*", zone_name = "yerinblog.cc.cd" }
]

assets = { directory = "public", binding = "ASSETS", run_worker_first = false }

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.sql"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "prain-demo"
database_id = "955c6f18-091e-450c-a509-16798c19d7d0"

[[kv_namespaces]]
binding = "KV"
id = "3500dd155f194fdc9aae07c339b0b485"

[vars]
DEMO_ADMIN_KEY = "yb-demo-8f3a9c2e5d71"
PRAIN_ENV = "worker"
BASE_DOMAIN = "yerinblog.cc.cd"
PLATFORM_HOST = "prain.yerinblog.cc.cd"
PLATFORM_NAME = "Prain 管理版"
CF_ACCOUNT_ID = "d9da0b8252a6fec3d62da97b6b52a3ca"

[observability]
enabled = true
